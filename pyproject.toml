[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[project]
name = "wingerbot"
version = "0.1.0"
description = "WingerBot: bot scripts for Wiktionary"
readme = "README.md"
authors = [
    { name = "Ben Wing", email = "ben@benwing.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pywikibot>=11.0.0",
    "patch-ng>=1.18.0",
    "python-bidi>=0.6.0",
    "mwparserfromhell>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
